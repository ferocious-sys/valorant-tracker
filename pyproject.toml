[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "valorant-tracker-cli"
version = "0.6.0"
description = "Dependency-free VALORANT tracker using HenrikDev API"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
valo = "valorant_tracker:main"

[tool.setuptools]
py-modules = ["valorant_tracker", "valorant_stats", "valorant_web", "valorant_ui", "valorant_overlay"]
